:root{
  --bg:#07101f;
  --surface:#0e1a30;
  --surface2:#152642;
  --line:#263b5e;
  --text:#f6f0df;
  --muted:#a9b4c8;
  --gold:#d7aa4a;
  --gold2:#f0d48b;
  --green:#7fc98f;
  --red:#ef9b9b
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

a{
  color:inherit
}

.shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(circle at 80% 0,#1d2f50 0,transparent 38%),var(--bg)
}

.proto-banner{
  background:#d7aa4a;
  color:#171104;
  text-align:center;
  padding:10px 14px;
  font-size:13px;
  font-weight:800
}

.auth-wrap{
  max-width:1120px;
  margin:auto;
  padding:38px 22px 60px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:34px;
  align-items:center
}

.auth-brand h1,.hero h1,.page-head h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  line-height:1.02;
  letter-spacing:-.04em
}

.auth-brand h1{
  font-size:64px;
  margin:14px 0
}

.auth-brand h1 em,.hero h1 em{
  color:var(--gold2);
  font-weight:400
}

.eyebrow{
  font-size:11px;
  letter-spacing:.22em;
  color:var(--gold);
  font-weight:800
}

.auth-brand>p{
  color:var(--muted);
  font-size:18px;
  line-height:1.6;
  max-width:560px
}

.auth-proof{
  margin:28px 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.auth-proof div{
  border-top:1px solid var(--line);
  padding-top:12px
}

.auth-proof strong,.auth-proof span{
  display:block
}

.auth-proof span{
  color:var(--muted);
  font-size:12px;
  margin-top:4px
}

.sample-strip{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.sample-strip span{
  border:1px solid var(--line);
  padding:8px 10px;
  border-radius:999px;
  font-size:12px
}

.tiny{
  color:var(--muted);
  font-size:12px;
  line-height:1.5
}

.auth-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  padding:26px;
  box-shadow:0 24px 70px #0008
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#081426;
  border-radius:11px;
  padding:4px
}

.tabs button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px;
  border-radius:8px
}

.tabs button.active{
  background:var(--gold);
  color:#171104;
  font-weight:800
}

.auth-card h2{
  font-family:Georgia,serif;
  font-size:29px;
  margin:20px 0 5px
}

.muted{
  color:var(--muted);
  line-height:1.55;
  font-size:14px
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:16px
}

label small{
  display:block;
  font-weight:400;
  color:var(--muted);
  margin-top:5px
}

input,select,textarea{
  width:100%;
  margin-top:7px;
  background:#081426;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:12px 13px;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--gold)
}

textarea{
  resize:vertical;
  min-height:88px
}

.alert{
  background:#3a241f;
  border:1px solid #7b4940;
  color:#ffc8b8;
  padding:11px;
  border-radius:9px;
  margin-top:14px;
  font-size:13px
}

.alert.ok{
  background:#173a26;
  border-color:#397154;
  color:#c8f2d5
}

.primary{
  border:0;
  background:var(--gold);
  color:#171104;
  border-radius:10px;
  padding:12px 16px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px
}

.primary:hover{
  background:var(--gold2)
}

.secondary{
  border:1px solid var(--line);
  background:#162844;
  color:var(--text);
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:8px
}

.secondary:disabled,.primary:disabled{
  opacity:.55;
  cursor:not-allowed
}

.auth-card .primary,.auth-card .demo-btn{
  width:100%;
  margin-top:16px
}

.demo-btn{
  border:1px dashed var(--gold);
  background:transparent;
  color:var(--gold2);
  padding:12px;
  border-radius:10px
}

.local-note{
  display:flex;
  gap:8px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin-top:16px
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:#081426ee;
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  gap:16px
}

.logo{
  text-decoration:none;
  font-family:Georgia,serif;
  font-size:25px;
  display:flex;
  align-items:center;
  gap:6px
}

.logo span{
  color:var(--gold)
}

.logo small{
  font-family:sans-serif;
  font-size:10px;
  background:#203659;
  padding:4px 6px;
  border-radius:99px
}

.mark{
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--gold);
  color:#171104;
  display:grid;
  place-items:center;
  font-size:18px
}

.topbar nav{
  display:flex;
  gap:4px
}

.topbar nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 12px;
  border-radius:8px;
  font-weight:700
}

.topbar nav button.nav-active{
  background:#203659;
  color:white
}

.user{
  display:flex;
  align-items:center;
  gap:10px
}

.credits-pill{
  display:flex;
  align-items:center;
  gap:5px;
  background:#2b240f;
  color:var(--gold2);
  padding:7px 10px;
  border-radius:99px;
  font-size:13px;
  font-weight:700
}

.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--gold);
  color:#171104;
  display:grid;
  place-items:center;
  font-weight:900
}

.logout{
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  gap:6px;
  align-items:center
}

.notice{
  max-width:1280px;
  margin:14px auto 0;
  padding:0 22px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#e5d9b6;
  font-size:13px
}

.app-main{
  max-width:1280px;
  margin:auto;
  padding:18px 22px 50px
}

.hero{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:30px;
  background:linear-gradient(120deg,#142644,#0d1a30);
  border:1px solid var(--line);
  border-radius:24px;
  padding:34px;
  overflow:hidden
}

.hero h1{
  font-size:54px;
  margin:14px 0
}

.hero>p{
  color:var(--muted);
  line-height:1.6;
  max-width:550px
}

.hero-actions{
  display:flex;
  gap:10px;
  margin-top:24px;
  flex-wrap:wrap
}

.hero-visual{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  min-height:280px
}

.kenburns{
  height:100%;
  min-height:280px;
  background:linear-gradient(125deg,#79551a,#392b18 45%,#10233e);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  animation:ken 9s ease-in-out infinite alternate
}

.kenburns>span{
  font-size:72px
}

.kenburns b{
  font-family:Georgia,serif;
  font-size:26px;
  margin-top:12px
}

.kenburns i{
  font-family:Georgia,serif;
  color:#f2d98e;
  margin-top:8px
}

.kenburns em{
  font-size:11px;
  color:#c9bfaa;
  margin-top:18px;
  font-style:normal
}

@keyframes ken{
  from{
    transform:scale(1)
  }

  to{
    transform:scale(1.08)
  }
}

.hero-meta{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:12px 14px;
  background:#0008;
  font-size:11px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin:16px 0
}

.stat{

.dl-card b,.dl-card small{
  display:block
}

.dl-card small{
  color:var(--muted)
}

.steps-list{
  display:grid;
  gap:11px;
  line-height:1.6;
  color:var(--muted);
  padding-left:20px
}

.steps-list b{
  color:var(--text)
}

.checkout-summary{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#081426;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  margin:14px 0
}

.checkout-summary b,.checkout-summary small{
  display:block
}

.success-icon{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#173a26;
  color:#7fc98f;
  display:grid;
  place-items:center
}

.status-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
  border-top:1px solid var(--line);
  padding-top:14px
}

.not-connected{
  color:#ef9b9b
}

@media(max-width:900px){
  .price-grid{
    grid-template-columns:1fr 1fr
  }

  .split-row{
    grid-template-columns:1fr
  }

  .qr-row{
    flex-direction:column;
    align-items:flex-start
  }

  .tx-table{
    min-width:520px
  }

  .owner-toggle span{
    display:none
  }

  .owner-toggle{
    padding:6px 8px
  }
}

@media(max-width:520px){
  .price-grid{
    grid-template-columns:1fr
  }

  .payout-list li{
    grid-template-columns:1fr
  }

  .split-controls{
    flex-wrap:wrap
  }
}
